    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in iframe/Cloud Run environment
      window.addEventListener('error', function(event) {
        if (event && (event.message?.includes('WebSocket') || event.filename?.includes('@vite/client'))) {
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (String(event.reason).includes('WebSocket') || event.reason.message?.includes('WebSocket'))) {
          event.stopImmediatePropagation();
        }
      });
    </script>
