<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0510" />
      <stop offset="40%" stop-color="#800F1F" />
      <stop offset="80%" stop-color="#9B1C2E" />
      <stop offset="100%" stop-color="#4A0510" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <pattern id="jalisPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.15"/>
      <circle cx="20" cy="20" r="3" fill="#D4AF37" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Rich Maroon Background -->
  <rect width="1200" height="450" fill="url(#bannerBg)" />
  <rect width="1200" height="450" fill="url(#jalisPattern)" />

  <!-- Borders -->
  <rect x="20" y="20" width="1160" height="410" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.6"/>
  <rect x="28" y="28" width="1144" height="394" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="8,6" opacity="0.4"/>

  <!-- Left Ornate Motif -->
  <g transform="translate(140, 225) scale(0.9)">
    <circle cx="0" cy="0" r="85" fill="#4A0510" stroke="url(#goldGradient)" stroke-width="4"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4,4"/>
    <path d="M 0 -45 C 18 -45 35 -25 35 -5 C 35 22 10 38 0 52 C -10 38 -35 22 -35 -5 C -35 -25 -18 -45 0 -45 Z" fill="url(#goldGradient)" opacity="0.85"/>
    <circle cx="0" cy="-10" r="10" fill="#4A0510"/>
  </g>

  <!-- Main Content Centered -->
  <text x="620" y="150" text-anchor="middle" font-family="'Plus Jakarta Sans', 'SolaimanLipi', sans-serif" font-size="68" font-weight="900" fill="#FFFFFF" letter-spacing="2">
    জনতা বস্ত্রালয়
  </text>

  <text x="620" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" fill="url(#goldGradient)" letter-spacing="8">
    JANATA BOSTRALOY
  </text>

  <text x="620" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="600" fill="#FCE7F3" letter-spacing="2">
    অভিজাত পোশাকের নির্ভরযোগ্য প্রতিষ্ঠান
  </text>

  <!-- Badges row -->
  <g transform="translate(620, 310)">
    <rect x="-320" y="-18" width="200" height="36" rx="18" fill="#FFFFFF" opacity="0.15" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="-220" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
      📞 01714 480 948
    </text>

    <rect x="-100" y="-18" width="210" height="36" rx="18" fill="#FFFFFF" opacity="0.15" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="5" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
      📍 Pubail Bazar, Gazipur
    </text>

    <rect x="130" y="-18" width="190" height="36" rx="18" fill="#FFFFFF" opacity="0.15" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="225" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
      🚚 সারাদেশে হোম ডেলিভারি
    </text>
  </g>

  <!-- Bottom Details -->
  <text x="620" y="375" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="400" fill="#E2E8F0" opacity="0.85">
    কটন থ্রি-পিস • লিলেন বাটিক • জয়পুরী কটন • বুটিক কালেকশন • সফট কাতান শাড়ি • শিপন ও জর্জেট
  </text>
</svg>
