<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="jbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="jbRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#580E14" />
    </linearGradient>
    <radialGradient id="jbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular background badge -->
  <circle cx="250" cy="250" r="230" fill="url(#jbRed)" stroke="url(#jbGold)" stroke-width="8"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="250" cy="250" r="190" fill="url(#jbGlow)"/>

  <!-- Ornate Motif -->
  <g transform="translate(250, 175) scale(1.15)">
    <!-- Traditional Saree Drapery Paisley / Kalka -->
    <path d="M 0 -70 C 25 -70 50 -45 50 -15 C 50 25 15 50 0 70 C -15 50 -50 25 -50 -15 C -50 -45 -25 -70 0 -70 Z" fill="none" stroke="url(#jbGold)" stroke-width="4"/>
    <path d="M 0 -50 C 18 -50 35 -30 35 -10 C 35 18 10 38 0 52 C -10 38 -35 18 -35 -10 C -35 -30 -18 -50 0 -50 Z" fill="url(#jbGold)" opacity="0.25"/>
    <circle cx="0" cy="-20" r="12" fill="url(#jbGold)"/>
    <path d="M -30 -15 Q 0 -35 30 -15 Q 0 10 -30 -15 Z" fill="url(#jbGold)"/>
    <circle cx="-18" cy="-55" r="4" fill="#FDE047"/>
    <circle cx="18" cy="-55" r="4" fill="#FDE047"/>
    <circle cx="0" cy="-78" r="5" fill="#FDE047"/>
  </g>

  <!-- Bengali Typography "জনতা বস্ত্রালয়" -->
  <text x="250" y="325" text-anchor="middle" font-family="'Plus Jakarta Sans', 'SolaimanLipi', 'Noto Sans Bengali', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="1">
    জনতা বস্ত্রালয়
  </text>

  <!-- English Subtitle "JANATA BOSTRALOY" -->
  <text x="250" y="365" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="url(#jbGold)" letter-spacing="4">
    JANATA BOSTRALOY
  </text>

  <!-- Tagline -->
  <text x="250" y="398" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Noto Sans Bengali', sans-serif" font-size="14" font-weight="500" fill="#FCE7F3" opacity="0.9" letter-spacing="1">
    অভিজাত পোশাকের নির্ভরযোগ্য প্রতিষ্ঠান • Pubail Bazar, Gazipur
  </text>
</svg>
